<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="https://correctiv.org/wp-content/uploads/2018/11/favicon-152.png" />
  <title>Drought days in Europe since 2012</title>
</head>

<body>
  <div id="map"></div>

  <div id="period-buttons">
    <button id="button_median_drought" class="active">Median</button>
    <button id="button_max_drought">Max.</button>
  </div>

  <div id="chart-panel-wrapper">
    <div class="map-overlay-element" id="chart-panel"></div>
  </div>

  <div id="map-legend-wrapper">
    <div class="map-overlay-element">
      <div id="map_legend"></div>
      <div id="legend-footer">
        <div id="source"></div>
        <div id="detail_button" class="collapsible-btn"></div>
      </div>
      <p class="collapsible-content"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
